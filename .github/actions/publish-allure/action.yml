name: Publish allure report
description: Generate the allure report and publish it to gh-pages under allure/<slug>.

inputs:
  slug:
    description: Report subdirectory (e.g. main or pr-123)
    required: true
  results-dir:
    description: Path to the raw allure-results
    required: true

runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
      with:
        ref: gh-pages
        path: gh-pages
        fetch-depth: 0
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '21'
    - shell: bash
      env:
        SLUG: ${{ inputs.slug }}
        RESULTS: ${{ inputs.results-dir }}
      run: |
        # carry over trend history
        if [ -d "gh-pages/allure/$SLUG/history" ]; then
          mkdir -p "$RESULTS/history"
          cp -r "gh-pages/allure/$SLUG/history/." "$RESULTS/history/"
        fi

        # generate
        npx --yes allure-commandline generate "$RESULTS" --clean -o allure-report

        # replace the published report
        rm -rf "gh-pages/allure/$SLUG"
        mkdir -p "gh-pages/allure/$SLUG"
        cp -r allure-report/. "gh-pages/allure/$SLUG/"

        # commit & push
        cd gh-pages
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add "allure/$SLUG"
        if git diff --cached --quiet; then
          echo "Nothing to publish for $SLUG"
          exit 0
        fi
        git commit -m "allure report for $SLUG"
        for attempt in 1 2 3 4 5; do
          if git push; then
            exit 0
          fi
          git pull --rebase --strategy-option=theirs || exit 1
        done
        echo "Failed to push allure report after 5 attempts" >&2
        exit 1
