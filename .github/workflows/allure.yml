name: Allure report

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Download allure results
        uses: actions/download-artifact@v8
        with:
          name: allure-results
          path: allure-results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Resolve and validate target slug
        id: target
        run: |
          slug="$(cat allure-results/target-slug.txt)"
          if ! printf '%s' "$slug" | grep -Eq '^(main|pr-[0-9]+)$'; then
            echo "invalid slug: $slug" && exit 1
          fi
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          rm -f allure-results/target-slug.txt

      - name: Checkout gh-pages
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages

      - name: Restore history for trends
        env:
          SLUG: ${{ steps.target.outputs.slug }}
        run: |
          if [ -d "gh-pages/allure/$SLUG/history" ]; then
            mkdir -p allure-results/history
            cp -r "gh-pages/allure/$SLUG/history/." allure-results/history/
          fi

      - name: Generate report
        run: npx --yes allure-commandline generate allure-results --clean -o allure-report

      - name: Publish to gh-pages
        env:
          SLUG: ${{ steps.target.outputs.slug }}
        run: |
          rm -rf "gh-pages/allure/$SLUG"
          mkdir -p "gh-pages/allure/$SLUG"
          cp -r allure-report/. "gh-pages/allure/$SLUG/"
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "allure/$SLUG"
          git commit -m "allure report for $SLUG" || exit 0
          git push
