name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rharkor/caching-for-turbo@v2.5.0
      - uses: jdx/mise-action@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck build test

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: rigi
          POSTGRES_PASSWORD: rigi
          POSTGRES_DB: rigi
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rigi"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      RIGI_DATABASE_URL: postgresql://rigi:rigi@localhost:5432/rigi
      RIGI_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
      - uses: rharkor/caching-for-turbo@v2.5.0
      - uses: jdx/mise-action@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rigi/core exec prisma migrate deploy
      - run: pnpm turbo run test:int

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: rigi
          POSTGRES_PASSWORD: rigi
          POSTGRES_DB: rigi
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rigi"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      RIGI_DATABASE_URL: postgresql://rigi:rigi@localhost:5432/rigi
      RIGI_REDIS_URL: redis://localhost:6379
      RIGI_PORT: '3000'
      E2E_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: rharkor/caching-for-turbo@v2.5.0
      - uses: jdx/mise-action@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build
      - run: pnpm --filter @rigi/core exec prisma migrate deploy
      - run: pnpm --filter @rigi/admin-e2e exec playwright install --with-deps chromium
      - name: Start app
        run: pnpm --filter @rigi/core start &
      - name: Wait for app
        uses: Jtalk/url-health-check-action@v5
        with:
          url: http://localhost:3000/health
          max-attempts: 30
          retry-delay: 2s
      - run: pnpm turbo run test:e2e
