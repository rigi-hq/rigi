services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rigi
      POSTGRES_PASSWORD: rigi
      POSTGRES_DB: rigi
    ports: ["5432:5432"]
    volumes: ["rigi_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rigi"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

volumes:
  rigi_pg:
